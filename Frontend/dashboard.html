<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendFeed - AI Trends Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <h1>🔥 TrendFeed</h1>
        <div>
            <button onclick="refreshTrends()" class="btn-secondary">🔄 새로고침</button>
            <button onclick="logout()" class="btn-logout">로그아웃</button>
        </div>
    </nav>

    <div class="container">
        <div class="feed-header">
            <h2>🚀 오늘의 AI 트렌드 TOP 10</h2>
            <p>23개 소스에서 실시간으로 수집된 AI 뉴스와 커뮤니티 버즈</p>
            <div class="date">📅 <span id="today"></span></div>
        </div>

        <!-- Data Sources Info -->
        <div class="sources-info">
            <div class="source-category">
                <span class="source-icon">📚</span>
                <span class="source-label">학술: arXiv</span>
            </div>
            <div class="source-category">
                <span class="source-icon">💻</span>
                <span class="source-label">코드: GitHub, Hugging Face</span>
            </div>
            <div class="source-category">
                <span class="source-icon">💬</span>
                <span class="source-label">커뮤니티: Reddit (16개), Hacker News</span>
            </div>
            <div class="source-category">
                <span class="source-icon">📰</span>
                <span class="source-label">뉴스: 15개 RSS 피드</span>
            </div>
        </div>

        <div id="keywords-feed" class="keywords-feed">
            <!-- 키워드 카드들이 여기 표시됨 -->
        </div>
    </div>

    <script>
        // Supabase 설정
        const SUPABASE_URL = 'https://hjmbrmdpvcrzthkxwjhm.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbWJybWRwdmNyenRoa3h3amhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkyMTUyMDYsImV4cCI6MjA3NDc5MTIwNn0.5VzmIJlwp_o6q7jthr4gbh5aeiTHLazi6Osmzv9Ef4U'
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

        let userId = localStorage.getItem('userId')

        // 오늘 날짜 표시
        const today = new Date().toLocaleDateString('ko-KR', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            weekday: 'long'
        })
        document.getElementById('today').textContent = today

        async function loadDashboard() {
            if (!userId) {
                window.location.href = 'index.html'
                return
            }

            // Try keyword insights endpoint first
            try {
                const response = await fetch('http://localhost:3001/api/keywords/insights?limit=10&hours=48')
                const data = await response.json()

                if (data.success && data.keywords && data.keywords.length > 0) {
                    displayKeywordInsights(data)
                    return
                }
            } catch (error) {
                console.log('Keyword insights API not available, trying trends API next')
            }

            // Fallback: try to get real trends from backend API
            try {
                const response = await fetch('http://localhost:3001/api/trends/daily?limit=10')
                const data = await response.json()

                if (data.success && data.trends && data.trends.length > 0) {
                    displayRealKeywords(data.trends, data.source)
                    return
                }
            } catch (error) {
                console.log('Backend trends API not available, using mock data')
            }

            // Fallback to mock data
            displayMockData()
        }

        function formatDateTime(dateString) {
            if (!dateString) return '알 수 없음'
            try {
                return new Date(dateString).toLocaleString('ko-KR', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            } catch (err) {
                return '알 수 없음'
            }
        }

        function displayKeywordInsights(payload) {
            const container = document.getElementById('keywords-feed')
            const hours = payload.window?.hours || 24
            const generatedAt = formatDateTime(payload.generated_at)

            container.innerHTML = `
                <div class="source-indicator">
                    <span class="source-badge">🔎 수집된 데이터</span>
                    <span class="source-info">최근 ${hours}시간 · ${payload.keywords.length}개 키워드 · 업데이트 ${generatedAt}</span>
                </div>
                ${payload.keywords.map(keyword => {
                    const summaryLines = (keyword.summary_sentences || []).length > 0
                        ? keyword.summary_sentences.map(line => `<span class="summary-line">${line}</span>`).join('<br>')
                        : '요약 정보를 불러오지 못했습니다.'
                    const lastSeen = formatDateTime(keyword.last_seen)
                    const firstSeen = formatDateTime(keyword.first_seen)

                    return `
                        <div class="keyword-card">
                            <div class="keyword-rank">#${keyword.rank}</div>
                            <h3 class="keyword-title">${keyword.keyword}</h3>
                            <p class="keyword-summary">${summaryLines}</p>
                            <div class="trend-metrics">
                                <span class="metric">📰 기사 ${keyword.unique_articles}건</span>
                                <span class="metric">📡 출처 ${keyword.unique_sources}곳</span>
                                <span class="metric">✅ 평균 신뢰도 ${(keyword.average_confidence || 0).toFixed(2)}</span>
                            </div>
                            <div class="keyword-meta">
                                <span>⏱️ 최근 업데이트: ${lastSeen}</span>
                                <span>🗓️ 최초 감지: ${firstSeen}</span>
                                <span>🔤 유형: ${keyword.keyword_types.join(', ')}</span>
                            </div>
                            <div class="keyword-actions">
                                <button onclick="viewTimeline('${keyword.keyword}')" class="btn-primary">
                                    📊 타임라인 보기
                                </button>
                                <a href="https://www.google.com/search?q=${encodeURIComponent(keyword.keyword)}&tbm=nws"
                                   target="_blank" class="btn-icon">
                                    🔗 Google News
                                </a>
                            </div>
                        </div>
                    `
                }).join('')}
            `
        }

        function displayRealKeywords(trends, source) {
            const container = document.getElementById('keywords-feed')
            const sourceBadge = source === 'real' ? '🔄 실시간 데이터' : '📊 데모 데이터'
            
            container.innerHTML = `
                <div class="source-indicator">
                    <span class="source-badge">${sourceBadge}</span>
                    <span class="source-info">${trends.length}개 트렌드 발견</span>
                </div>
                ${trends.map((trend, i) => `
                    <div class="keyword-card">
                        <div class="keyword-rank">#${i + 1}</div>
                        <h3 class="keyword-title">${trend.canonical_trends?.canonical_name || trend.keyword || 'Unknown'}</h3>
                        <p class="keyword-summary">${trend.canonical_trends?.description || trend.summary || 'AI 트렌드 분석 결과'}</p>
                        <div class="trend-metrics">
                            <span class="metric">📊 점수: ${(trend.trend_score || 0).toFixed(1)}</span>
                            <span class="metric">📈 볼륨: ${trend.volume || 0}</span>
                            <span class="metric">⚡ 속도: ${trend.velocity || 0}%</span>
                            ${trend.sentiment ? `<span class="metric">😊 감정: ${(trend.sentiment * 100).toFixed(0)}%</span>` : ''}
                        </div>
                        <div class="keyword-actions">
                            <button onclick="viewTimeline('${trend.canonical_trends?.canonical_name || trend.keyword}')" class="btn-primary">
                                📊 타임라인 보기
                            </button>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(trend.canonical_trends?.canonical_name || trend.keyword)}&tbm=nws" 
                               target="_blank" class="btn-icon">
                                🔗 Google News
                            </a>
                        </div>
                    </div>
                `).join('')}
                `
        }

        function displayMockData() {
            const container = document.getElementById('keywords-feed')
            
            const mockTrends = [
                {
                    keyword: 'GPT-5 출시 예정',
                    summary: 'OpenAI가 차세대 모델 GPT-5 출시 계획 발표. 성능이 대폭 향상되고 멀티모달 기능이 강화될 것으로 예상',
                    trend_score: 98.5,
                    volume: 15230,
                    velocity: 1250,
                    sentiment: 0.65
                },
                {
                    keyword: 'Gemini 2.0 업데이트',
                    summary: '구글의 AI 모델 Gemini 2.0 출시. 코딩 능력과 추론 성능이 크게 개선됨',
                    trend_score: 92.1,
                    volume: 8500,
                    velocity: 450,
                    sentiment: 0.72
                },
                {
                    keyword: 'Llama 3.1 오픈소스',
                    summary: 'Meta가 Llama 3.1 모델을 오픈소스로 공개. 405B 파라미터 버전 포함',
                    trend_score: 89.3,
                    volume: 12400,
                    velocity: 890,
                    sentiment: 0.78
                },
                {
                    keyword: 'Claude Sonnet 4.5',
                    summary: 'Anthropic의 새로운 Claude 모델 출시. 긴 컨텍스트 처리 능력 향상',
                    trend_score: 85.7,
                    volume: 6200,
                    velocity: 320,
                    sentiment: 0.68
                },
                {
                    keyword: 'Stable Diffusion 3.5',
                    summary: 'Stability AI의 최신 이미지 생성 모델. 텍스트 렌더링과 손 표현 개선',
                    trend_score: 82.4,
                    volume: 9800,
                    velocity: 560,
                    sentiment: 0.71
                },
                {
                    keyword: 'NVIDIA H200 출시',
                    summary: 'NVIDIA의 차세대 AI 칩 H200 출시. 성능이 H100 대비 2배 향상',
                    trend_score: 79.8,
                    volume: 5400,
                    velocity: 280,
                    sentiment: 0.64
                },
                {
                    keyword: 'AI 규제법 통과',
                    summary: 'EU AI Act 최종 승인. 2025년부터 시행 예정',
                    trend_score: 76.2,
                    volume: 4200,
                    velocity: 190,
                    sentiment: 0.42
                },
                {
                    keyword: 'Mistral Large 2',
                    summary: 'Mistral AI의 새로운 대형 언어 모델 출시. 유럽 기반 AI 모델로 주목',
                    trend_score: 73.5,
                    volume: 3800,
                    velocity: 210,
                    sentiment: 0.69
                },
                {
                    keyword: 'RAG 최적화 기법',
                    summary: '검색 증강 생성(RAG) 성능 향상을 위한 새로운 기법들이 연구 커뮤니티에서 화제',
                    trend_score: 70.1,
                    volume: 2900,
                    velocity: 150,
                    sentiment: 0.58
                },
                {
                    keyword: 'AI 에이전트 프레임워크',
                    summary: 'LangChain, AutoGPT 등 AI 에이전트 개발 프레임워크의 발전이 가속화',
                    trend_score: 67.8,
                    volume: 3200,
                    velocity: 180,
                    sentiment: 0.62
                }
            ]

            container.innerHTML = `
                <div class="source-indicator">
                    <span class="source-badge">📊 데모 데이터</span>
                    <span class="source-info">백엔드 서버를 시작하면 실시간 트렌드를 볼 수 있습니다</span>
                    </div>
                ${mockTrends.map((trend, i) => `
                <div class="keyword-card">
                        <div class="keyword-rank">#${i + 1}</div>
                        <h3 class="keyword-title">${trend.keyword}</h3>
                        <p class="keyword-summary">${trend.summary}</p>
                        <div class="trend-metrics">
                            <span class="metric">📊 점수: ${trend.trend_score.toFixed(1)}</span>
                            <span class="metric">📈 볼륨: ${trend.volume.toLocaleString()}</span>
                            <span class="metric">⚡ 속도: +${trend.velocity}%</span>
                            <span class="metric">😊 감정: ${(trend.sentiment * 100).toFixed(0)}%</span>
                        </div>
                    <div class="keyword-actions">
                            <button onclick="viewTimeline('${trend.keyword}')" class="btn-primary">
                            📊 타임라인 보기
                        </button>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(trend.keyword)}&tbm=nws" 
                               target="_blank" class="btn-icon">
                                🔗 Google News
                        </a>
                    </div>
                </div>
                `).join('')}
            `
        }

        function viewTimeline(keyword) {
            window.location.href = `timeline.html?keyword=${encodeURIComponent(keyword)}`
        }

        function refreshTrends() {
            location.reload()
        }

        function logout() {
            localStorage.removeItem('userId')
            window.location.href = 'index.html'
        }

        // 페이지 로드 시 대시보드 초기화
        loadDashboard()
    </script>
</body>
</html>
