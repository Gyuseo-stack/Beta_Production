<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendFeed - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <h1>TrendFeed</h1>
        <div>
            <button onclick="openMyPage()" class="btn-secondary">👤 마이페이지</button>
            <button onclick="openAgentModal()" class="btn-secondary">⚙️ 설정</button>
            <button onclick="logout()" class="btn-logout">로그아웃</button>
        </div>
    </nav>

    <div class="container">
        <!-- 에이전트 선택 바 개선 -->
        <div class="agent-switch-bar">
            <div class="agent-tabs" id="agent-tabs">
                <!-- 에이전트 탭들이 여기 표시됨 -->
            </div>
        </div>

        <div class="feed-header">
            <h2 id="agent-name">로딩중...</h2>
            <p id="agent-domain"></p>
            <div class="date">📅 <span id="today"></span></div>
        </div>

        <div id="keywords-feed" class="keywords-feed">
            <!-- 키워드 카드들이 여기 표시됨 -->
        </div>
    </div>

    <!-- 마이페이지 모달 -->
    <div id="mypage-modal" class="modal" style="display:none" onclick="closeMyPageOnBackdrop(event)">
        <div class="modal-content">
            <h2>👤 마이페이지</h2>
            
            <form onsubmit="updateProfile(event)">
                <div class="profile-view" id="profile-view">
                    <div class="profile-item">
                        <label>이메일</label>
                        <p id="view-email">-</p>
                    </div>
                    <div class="profile-item">
                        <label>나이</label>
                        <p id="view-age">-</p>
                    </div>
                    <div class="profile-item">
                        <label>직업군</label>
                        <p id="view-occupation">-</p>
                    </div>
                    <div class="profile-item">
                        <label>관심 분야</label>
                        <p id="view-interests">-</p>
                    </div>
                </div>

                <div class="profile-edit" id="profile-edit" style="display:none">
                    <label>나이</label>
                    <input type="number" id="edit-age" min="10" max="100">

                    <label>직업군</label>
                    <select id="edit-occupation">
                        <option value="">선택해주세요</option>
                        <option value="개발자/엔지니어">개발자/엔지니어</option>
                        <option value="프로덕트 매니저">프로덕트 매니저</option>
                        <option value="디자이너">디자이너</option>
                        <option value="데이터 분석가">데이터 분석가</option>
                        <option value="마케터">마케터</option>
                        <option value="창업가/CEO">창업가/CEO</option>
                        <option value="투자자/VC">투자자/VC</option>
                        <option value="연구원">연구원</option>
                        <option value="학생">학생</option>
                        <option value="기타">기타</option>
                    </select>

                    <label>관심 분야 (쉼표로 구분)</label>
                    <input type="text" id="edit-interests" placeholder="예: AI, 클라우드, 블록체인">
                </div>

                <div class="modal-buttons">
                    <button type="button" onclick="closeMyPage()" class="btn-secondary">닫기</button>
                    <button type="button" id="edit-btn" onclick="toggleEdit()" class="btn-primary">수정</button>
                    <button type="submit" id="save-btn" style="display:none" class="btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="agent-modal" class="modal" style="display:none" onclick="closeModalOnBackdrop(event)">
        <div class="modal-content modal-large">
            <h2>⚙️ 설정</h2>
            
            <div class="agent-list">
                <h3>내 에이전트 목록</h3>
                <div id="agent-list-container">
                    <!-- 에이전트 목록 -->
                </div>
            </div>

            <div class="add-agent-section">
                <h3>새 에이전트 추가</h3>
                <form onsubmit="createAgent(event)">
                    <label>에이전트 이름</label>
                    <input type="text" id="new-agent-name" placeholder="예: AI 트렌드 추적기" required>

                    <label>추적할 분야</label>
                    <select id="new-agent-domain" required>
                        <option value="">선택해주세요</option>
                        <option value="인공지능/머신러닝">인공지능/머신러닝</option>
                        <option value="클라우드/인프라">클라우드/인프라</option>
                        <option value="프론트엔드">프론트엔드</option>
                        <option value="백엔드">백엔드</option>
                        <option value="DevOps">DevOps</option>
                        <option value="블록체인/Web3">블록체인/Web3</option>
                        <option value="사이버보안">사이버보안</option>
                        <option value="데이터 사이언스">데이터 사이언스</option>
                        <option value="모바일 개발">모바일 개발</option>
                        <option value="게임 개발">게임 개발</option>
                        <option value="IT 정책/규제">IT 정책/규제</option>
                        <option value="스타트업/벤처">스타트업/벤처</option>
                    </select>

                    <div class="modal-buttons">
                        <button type="button" onclick="closeAgentModal()" class="btn-secondary">닫기</button>
                        <button type="submit" class="btn-primary">추가</button>
                    </div>
                </form>
            </div>

            <div class="reset-section">
                <hr style="margin: 30px 0; border: none; border-top: 1px solid #e9ecef;">
                <h3>계정 설정</h3>
                <button type="button" onclick="resetOnboarding()" class="btn-reset">
                    🔄 온보딩 다시 하기
                </button>
                <p class="reset-note">관심사와 직업군을 다시 설정할 수 있습니다</p>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 여기에 본인의 Supabase 키를 입력하세요
        const SUPABASE_URL = 'https://hjmbrmdpvcrzthkxwjhm.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqbWJybWRwdmNyenRoa3h3amhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkyMTUyMDYsImV4cCI6MjA3NDc5MTIwNn0.5VzmIJlwp_o6q7jthr4gbh5aeiTHLazi6Osmzv9Ef4U'
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

        let userId = localStorage.getItem('userId')
        let currentAgentId = null
        let userInfo = null // 사용자 정보 저장

        // 오늘 날짜 표시
        const today = new Date().toLocaleDateString('ko-KR', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        })
        document.getElementById('today').textContent = today

        async function loadDashboard() {
            if (!userId) {
                window.location.href = 'index.html'
                return
            }

            // 사용자 정보 로드
            const { data: user, error: userError } = await supabase
                .from('users')
                .select()
                .eq('id', userId)
                .single()

            if (userError || !user) {
                alert('사용자 정보를 불러올 수 없습니다')
                logout()
                return
            }

            userInfo = user // 전역 변수에 저장

            // 에이전트 목록 로드
            const { data: agents } = await supabase
                .from('agents')
                .select()
                .eq('user_id', userId)
                .order('created_at', { ascending: false })

            if (agents && agents.length > 0) {
                loadAgentTabs(agents)
                currentAgentId = agents[0].id
                loadKeywords(currentAgentId)
            } else {
                document.getElementById('keywords-feed').innerHTML = `
                    <div class="empty-state">
                        <p>아직 에이전트가 없습니다</p>
                        <button onclick="openAgentModal()" class="btn-primary">첫 에이전트 만들기</button>
                    </div>
                `
            }
        }

        function loadAgentTabs(agents) {
            const container = document.getElementById('agent-tabs')
            container.innerHTML = agents.map((agent, i) => `
                <button 
                    class="agent-tab ${i === 0 ? 'active' : ''}" 
                    onclick="switchToAgent('${agent.id}')"
                    data-agent-id="${agent.id}">
                    ${agent.name}
                </button>
            `).join('')
        }

        function switchToAgent(agentId) {
            currentAgentId = agentId
            
            // 탭 활성화 상태 변경
            document.querySelectorAll('.agent-tab').forEach(tab => {
                if (tab.dataset.agentId === agentId) {
                    tab.classList.add('active')
                } else {
                    tab.classList.remove('active')
                }
            })
            
            loadKeywords(agentId)
        }

        async function loadKeywords(agentId) {
            // 에이전트 정보
            const { data: agent } = await supabase
                .from('agents')
                .select()
                .eq('id', agentId)
                .single()

            document.getElementById('agent-name').textContent = agent.name
            document.getElementById('agent-domain').textContent = agent.domain

            // 키워드 목록
            const { data: keywords } = await supabase
                .from('keywords')
                .select()
                .eq('agent_id', agentId)
                .order('rank', { ascending: true })

            if (keywords && keywords.length > 0) {
                displayKeywords(keywords)
            } else {
                document.getElementById('keywords-feed').innerHTML = `
                    <div class="empty-state">
                        <p>아직 키워드가 생성되지 않았습니다</p>
                    </div>
                `
            }
        }

        function displayKeywords(keywords) {
            const container = document.getElementById('keywords-feed')
            container.innerHTML = keywords.map((kw, i) => `
                <div class="keyword-card">
                    <div class="keyword-rank">#${kw.rank || i + 1}</div>
                    <h3 class="keyword-title">${kw.keyword}</h3>
                    <p class="keyword-summary">${kw.summary}</p>
                    <div class="keyword-actions">
                        <button onclick="viewTimeline('${kw.keyword}')" class="btn-primary">
                            📊 타임라인 보기
                        </button>
                        <button onclick="archive('${kw.id}', '${kw.keyword}')" class="btn-icon">
                            ⭐ 저장
                        </button>
                    </div>
                    <div class="keyword-meta">
                        <span>🔗 관련 기사</span>
                        <a href="https://www.google.com/search?q=${encodeURIComponent(kw.keyword)}&tbm=nws" target="_blank" class="link-external">
                            Google News
                        </a>
                    </div>
                </div>
            `).join('')
        }

        function viewTimeline(keyword) {
            window.location.href = `timeline.html?keyword=${encodeURIComponent(keyword)}&agent=${currentAgentId}`
        }

        async function archive(keywordId, keyword) {
            const { error } = await supabase
                .from('archived_keywords')
                .insert([{ 
                    user_id: userId, 
                    keyword_id: keywordId,
                    keyword: keyword,
                    archived_at: new Date().toISOString()
                }])

            if (error) {
                alert('저장 실패: ' + error.message)
            } else {
                alert('✅ 키워드가 저장되었습니다!')
            }
        }

        // ========================================
        // 마이페이지 관련 함수들
        // ========================================
        
        function openMyPage() {
            if (!userInfo) {
                alert('사용자 정보를 불러오는 중입니다')
                return
            }

            // 정보 표시
            document.getElementById('view-email').textContent = userInfo.email || '-'
            document.getElementById('view-age').textContent = userInfo.age || '-'
            document.getElementById('view-occupation').textContent = userInfo.occupation || '-'
            document.getElementById('view-interests').textContent = userInfo.interests || '-'

            // 수정 폼에도 값 설정
            document.getElementById('edit-age').value = userInfo.age || ''
            document.getElementById('edit-occupation').value = userInfo.occupation || ''
            document.getElementById('edit-interests').value = userInfo.interests || ''

            document.getElementById('mypage-modal').style.display = 'flex'
        }

        function closeMyPage() {
            document.getElementById('mypage-modal').style.display = 'none'
            // 보기 모드로 돌아가기
            document.getElementById('profile-view').style.display = 'block'
            document.getElementById('profile-edit').style.display = 'none'
            document.getElementById('edit-btn').style.display = 'block'
            document.getElementById('save-btn').style.display = 'none'
        }

        function closeMyPageOnBackdrop(event) {
            if (event.target.id === 'mypage-modal') {
                closeMyPage()
            }
        }

        function toggleEdit() {
            document.getElementById('profile-view').style.display = 'none'
            document.getElementById('profile-edit').style.display = 'block'
            document.getElementById('edit-btn').style.display = 'none'
            document.getElementById('save-btn').style.display = 'block'
        }

        async function updateProfile(e) {
            e.preventDefault()

            const age = document.getElementById('edit-age').value
            const occupation = document.getElementById('edit-occupation').value
            const interests = document.getElementById('edit-interests').value

            const { error } = await supabase
                .from('users')
                .update({ age, occupation, interests })
                .eq('id', userId)

            if (error) {
                alert('수정 실패: ' + error.message)
            } else {
                alert('✅ 정보가 업데이트되었습니다!')
                // 사용자 정보 다시 로드
                const { data: user } = await supabase
                    .from('users')
                    .select()
                    .eq('id', userId)
                    .single()
                
                userInfo = user
                closeMyPage()
            }
        }

        // ========================================
        // 설정 모달 관련 함수들
        // ========================================
        
        function openAgentModal() {
            console.log('설정 모달 열기') // 디버그용
            loadAgentList()
            document.getElementById('agent-modal').style.display = 'flex'
        }

        function closeAgentModal() {
            document.getElementById('agent-modal').style.display = 'none'
            document.getElementById('new-agent-name').value = ''
            document.getElementById('new-agent-domain').value = ''
        }

        // 모달 배경 클릭 시 닫기
        function closeModalOnBackdrop(event) {
            if (event.target.id === 'agent-modal') {
                closeAgentModal()
            }
        }

        async function loadAgentList() {
            const { data: agents } = await supabase
                .from('agents')
                .select()
                .eq('user_id', userId)
                .order('created_at', { ascending: false })

            const container = document.getElementById('agent-list-container')
            if (agents && agents.length > 0) {
                container.innerHTML = agents.map(agent => `
                    <div class="agent-item">
                        <div>
                            <strong>${agent.name}</strong>
                            <p>${agent.domain}</p>
                        </div>
                        <button onclick="deleteAgent('${agent.id}')" class="btn-delete">삭제</button>
                    </div>
                `).join('')
            } else {
                container.innerHTML = '<p class="empty-text">에이전트가 없습니다</p>'
            }
        }

        async function createAgent(e) {
            e.preventDefault()

            const name = document.getElementById('new-agent-name').value
            const domain = document.getElementById('new-agent-domain').value

            const { data, error } = await supabase
                .from('agents')
                .insert([{ user_id: userId, name, domain }])
                .select()

            if (error) {
                alert('에이전트 생성 실패: ' + error.message)
            } else {
                await generateMockKeywords(data[0].id, domain)
                closeAgentModal()
                loadDashboard()
            }
        }

        async function deleteAgent(agentId) {
            if (!confirm('정말 이 에이전트를 삭제하시겠습니까?')) {
                return
            }

            const { error } = await supabase
                .from('agents')
                .delete()
                .eq('id', agentId)

            if (error) {
                alert('삭제 실패: ' + error.message)
            } else {
                closeAgentModal()
                loadDashboard()
            }
        }
